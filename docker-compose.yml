version: '3.9'

services:
  nginx:
    image: nginx:stable-alpine
    volumes:
      - ./docker-resources/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./logs/nginx:/var/log/nginx
      - .:/var/www/html:ro
    depends_on:
      - php-fpm
    labels:
      - traefik.enable=true
      - traefik.http.routers.php.rule=Host(`${COMPOSE_PROJECT_NAME}.local.harborn.com`)

  php-fpm:
    build:
      context: .
      dockerfile: "./Dockerfile"
    volumes:
      - .:/var/www/html

  db:
    image: mysql:5.7
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: harborn
      MYSQL_USER: admin
      MYSQL_PASSWORD: password
    ports:
      - '3306:3306'
    volumes:
      - db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin
    restart: always
    ports:
      - '8081:80'
    environment:
      PMA_HOST: db
      PMA_USER: admin
      PMA_PASSWORD: password
    depends_on:
      - db
    labels:
      - traefik.enable=true
      - traefik.http.routers.phpmyadmin.rule=Host(`${COMPOSE_PROJECT_NAME}-phpmyadmin.local.harborn.com`)

  proxy:
    build:
      context: .
      target: traefik
    container_name: "${COMPOSE_PROJECT_NAME}-proxy"
    environment:
      COMPOSE_PROJECT_NAME: "${COMPOSE_PROJECT_NAME}"
    labels:
      - "traefik.http.middlewares.test-compress.compress=true"
    ports:
      - "${TRAEFIK_PUBLIC_PORT:-80}:80"
      - "${TRAEFIK_PUBLIC_PORT_SECURE:-443}:443"
      - "${TRAEFIK_PUBLIC_PORT_API:-8080}:8080"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - ./docker-resources/traefik/dynamic/dynamic.yaml:/etc/traefik/dynamic.yaml

volumes:
  db_data:
  logs: