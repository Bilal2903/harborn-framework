services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./bedrock.conf:/etc/nginx/conf.d/default.conf
    container_name: bedrock_app
    restart: unless-stopped
    depends_on:
      - php-fpm

  php-fpm:
    image: php:8.3-fpm
    volumes:
      - .:/var/www/html